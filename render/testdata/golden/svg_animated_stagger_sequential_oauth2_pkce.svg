<svg viewBox="0 0 700 660" xmlns="http://www.w3.org/2000/svg" class="theme-light">
  <style>

    /* Light theme (default) */
    :root, .theme-light {
      --color-primary: #1a365d;
      --color-secondary: #2c5282;
      --color-accent: #3182ce;
      --color-bg: #ffffff;
      --color-text: #1a202c;
      --color-text-muted: #718096;
      --color-line: #3182ce;
      --color-line-response: #a0aec0;
      --color-lifeline: #cbd5e0;
      --color-participant-bg: #1a365d;
      --color-participant-text: #ffffff;
      --color-dot: #3182ce;
    }

    /* Dark theme */
    .theme-dark {
      --color-primary: #63b3ed;
      --color-secondary: #90cdf4;
      --color-accent: #4299e1;
      --color-bg: #1a202c;
      --color-text: #e2e8f0;
      --color-text-muted: #a0aec0;
      --color-line: #63b3ed;
      --color-line-response: #4a5568;
      --color-lifeline: #4a5568;
      --color-participant-bg: #4299e1;
      --color-participant-text: #ffffff;
      --color-dot: #63b3ed;
    }

    /* Element styles */
    .participant-box {
      fill: var(--color-participant-bg);
    }

    .participant-text {
      fill: var(--color-participant-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .lifeline {
      stroke: var(--color-lifeline);
      stroke-width: 1;
      stroke-dasharray: 4,4;
    }

    .message-line {
      fill: none;
      stroke: var(--color-line);
      stroke-width: 1.5;
    }

    .message-line-response {
      fill: none;
      stroke: var(--color-line-response);
      stroke-width: 1.5;
      stroke-dasharray: 6,3;
    }

    .message-arrow {
      fill: var(--color-line);
    }

    .message-arrow-response {
      fill: var(--color-line-response);
    }

    .message-text {
      fill: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
    }

    .step-circle {
      fill: var(--color-accent);
    }

    .step-number {
      fill: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Phase box styles */
    .phase-box {
      stroke: var(--color-lifeline);
      stroke-width: 1;
      stroke-dasharray: 4, 2;
    }

    .phase-label {
      fill: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Alternative badge styles */
    .alt-badge-bg {
      fill: var(--color-accent);
      opacity: 0.9;
    }

    .alt-badge-text {
      fill: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 8px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .alt-badge {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .alt-badge:hover {
      transform: scale(1.1);
    }

    /* Note styles */
    .message-note {
      fill: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-style: italic;
    }

    /* Interactive hover states */
    .participant-box {
      transition: filter 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .participant-box:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .message-line, .message-line-response {
      transition: stroke-width 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .message-line:hover, .message-line-response:hover {
      stroke-width: 2.5;
      filter: drop-shadow(0 0 2px var(--color-line));
    }

    .message-text {
      transition: font-weight 0.2s ease;
      cursor: pointer;
    }

    .message-text:hover {
      font-weight: 600;
    }

    .flow-dot {
      transition: r 0.15s ease;
    }

    .flow-dot:hover {
      r: 6;
    }

    .step-circle {
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .step-circle:hover {
      transform: scale(1.2);
    }

    /* Print styles */
    @media print {
      .flow-dot {
        display: none;
      }
      /* Disable hover effects in print */
      .participant-box:hover,
      .message-line:hover,
      .message-line-response:hover {
        filter: none;
        transform: none;
      }
    }

    /* Animation keyframes */
    @keyframes flow {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.3); }
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 2px currentColor); }
      50% { filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 12px currentColor); }
    }

    .flow-dot {
      offset-rotate: 0deg;
    }

    .flow-dot-0 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(0 * 2s);
    }

    .flow-dot-1 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(1 * 2s);
    }

    .flow-dot-2 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(2 * 2s);
    }

    .flow-dot-3 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(3 * 2s);
    }

    .flow-dot-4 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(4 * 2s);
    }

    .flow-dot-5 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(5 * 2s);
    }

    .flow-dot-6 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(6 * 2s);
    }

    .flow-dot-7 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(7 * 2s);
    }

    .flow-dot-8 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(8 * 2s);
    }

    .flow-dot-9 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(9 * 2s);
    }

    .flow-dot-10 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(10 * 2s);
    }

    .flow-dot-11 {
      fill: var(--color-dot);
      r: 4;
      animation: flow 2s linear infinite;
      animation-delay: calc(11 * 2s);
    }
  </style>

  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-message-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="message-arrow"/>
    </marker>
    <marker id="arrow-message-arrow-reverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" class="message-arrow"/>
    </marker>
    <marker id="arrow-message-arrow-response" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="message-arrow-response"/>
    </marker>
    <marker id="arrow-message-arrow-response-reverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" class="message-arrow-response"/>
    </marker>
  </defs>

  <text x="350" y="12" class="message-text" style="font-size:14px;font-weight:600;text-anchor:middle;">OAuth 2.0 Authorization Code Flow with PKCE</text>

  <!-- Phase boxes -->
  <g class="phase-boxes">
    <rect class="phase-box" x="40" y="40" width="340" height="100" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="48" y="54">PKCE Setup</text>
    <rect class="phase-box" x="40" y="130" width="480" height="280" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="48" y="144">Authorization</text>
    <rect class="phase-box" x="320" y="400" width="200" height="100" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="328" y="414">Token Exchange</text>
    <rect class="phase-box" x="320" y="490" width="340" height="100" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="328" y="504">Resource Access</text>
  </g>

  <!-- Lifelines -->
  <g class="lifelines">
    <line class="lifeline" x1="70" y1="56" x2="70" y2="640"/>
    <line class="lifeline" x1="210" y1="56" x2="210" y2="640"/>
    <line class="lifeline" x1="350" y1="56" x2="350" y2="640"/>
    <line class="lifeline" x1="490" y1="56" x2="490" y2="640"/>
    <line class="lifeline" x1="630" y1="56" x2="630" y2="640"/>
  </g>

  <!-- Participants -->
  <g class="participants">
    <rect class="participant-box" x="20" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="70" y="38">Resource Owner</text>
    <rect class="participant-box" x="160" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="210" y="38">User Agent</text>
    <rect class="participant-box" x="300" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="350" y="38">Public Client</text>
    <rect class="participant-box" x="440" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="490" y="38">Authorization Server</text>
    <rect class="participant-box" x="580" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="630" y="38">Resource Server</text>
  </g>

  <!-- Messages -->
  <g class="messages">
    <path id="msg-path-0" class="message-line" d="M70,70 L350,70" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="80" cy="70" r="8"/>
    <text class="step-number" x="80" y="70">1</text>
    <text class="message-text" x="210" y="62" text-anchor="middle">Click Login</text>
    <circle class="flow-dot flow-dot-0" r="4" style="offset-path: path('M70,70 L350,70');"/>
    <path id="msg-path-1" class="message-line" d="M350,115 L350,115" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="360" cy="115" r="8"/>
    <text class="step-number" x="360" y="115">2</text>
    <text class="message-text" x="350" y="107" text-anchor="middle">Generate code_verifier + code_challenge</text>
    <circle class="flow-dot flow-dot-1" r="4" style="offset-path: path('M350,115 L350,115');"/>
    <path id="msg-path-2" class="message-line" d="M350,160 L210,160" marker-end="url(#arrow-message-arrow-reverse)"/>
    <circle class="step-circle" cx="340" cy="160" r="8"/>
    <text class="step-number" x="340" y="160">3</text>
    <text class="message-text" x="280" y="152" text-anchor="middle">Redirect with code_challenge</text>
    <circle class="flow-dot flow-dot-2" r="4" style="offset-path: path('M350,160 L210,160');"/>
    <path id="msg-path-3" class="message-line" d="M210,205 L490,205" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="220" cy="205" r="8"/>
    <text class="step-number" x="220" y="205">4</text>
    <text class="message-text" x="350" y="197" text-anchor="middle">GET /authorize?code_challenge=...&amp;code_challenge_method=S256</text>
    <circle class="flow-dot flow-dot-3" r="4" style="offset-path: path('M210,205 L490,205');"/>
    <path id="msg-path-4" class="message-line" d="M490,250 L70,250" marker-end="url(#arrow-message-arrow-reverse)"/>
    <circle class="step-circle" cx="480" cy="250" r="8"/>
    <text class="step-number" x="480" y="250">5</text>
    <text class="message-text" x="280" y="242" text-anchor="middle">Login + Consent Form</text>
    <circle class="flow-dot flow-dot-4" r="4" style="offset-path: path('M490,250 L70,250');"/>
    <path id="msg-path-5" class="message-line" d="M70,295 L490,295" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="80" cy="295" r="8"/>
    <text class="step-number" x="80" y="295">6</text>
    <text class="message-text" x="280" y="287" text-anchor="middle">Submit Credentials + Grant Consent</text>
    <circle class="flow-dot flow-dot-5" r="4" style="offset-path: path('M70,295 L490,295');"/>
    <path id="msg-path-6" class="message-line" d="M490,340 L210,340" marker-end="url(#arrow-message-arrow-reverse)"/>
    <circle class="step-circle" cx="480" cy="340" r="8"/>
    <text class="step-number" x="480" y="340">7</text>
    <text class="message-text" x="350" y="332" text-anchor="middle">Redirect with code (code_challenge stored server-side)</text>
    <circle class="flow-dot flow-dot-6" r="4" style="offset-path: path('M490,340 L210,340');"/>
    <path id="msg-path-7" class="message-line" d="M210,385 L350,385" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="220" cy="385" r="8"/>
    <text class="step-number" x="220" y="385">8</text>
    <text class="message-text" x="280" y="377" text-anchor="middle">Callback with Authorization Code</text>
    <circle class="flow-dot flow-dot-7" r="4" style="offset-path: path('M210,385 L350,385');"/>
    <path id="msg-path-8" class="message-line" d="M350,430 L490,430" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="360" cy="430" r="8"/>
    <text class="step-number" x="360" y="430">9</text>
    <text class="message-text" x="420" y="422" text-anchor="middle">POST /token (code + code_verifier)</text>
    <circle class="flow-dot flow-dot-8" r="4" style="offset-path: path('M350,430 L490,430');"/>
    <path id="msg-path-9" class="message-line-response" d="M490,475 L350,475" marker-end="url(#arrow-message-arrow-response-reverse)"/>
    <circle class="step-circle" cx="480" cy="475" r="8"/>
    <text class="step-number" x="480" y="475">10</text>
    <text class="message-text" x="420" y="467" text-anchor="middle">Access Token + Refresh Token</text>
    <circle class="flow-dot flow-dot-9" r="4" style="offset-path: path('M490,475 L350,475');"/>
    <path id="msg-path-10" class="message-line" d="M350,520 L630,520" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="360" cy="520" r="8"/>
    <text class="step-number" x="360" y="520">11</text>
    <text class="message-text" x="490" y="512" text-anchor="middle">API Request (Authorization: Bearer &lt;token&gt;)</text>
    <circle class="flow-dot flow-dot-10" r="4" style="offset-path: path('M350,520 L630,520');"/>
    <path id="msg-path-11" class="message-line-response" d="M630,565 L350,565" marker-end="url(#arrow-message-arrow-response-reverse)"/>
    <circle class="step-circle" cx="620" cy="565" r="8"/>
    <text class="step-number" x="620" y="565">12</text>
    <text class="message-text" x="490" y="557" text-anchor="middle">Protected Resource</text>
    <circle class="flow-dot flow-dot-11" r="4" style="offset-path: path('M630,565 L350,565');"/>
  </g>
</svg>
