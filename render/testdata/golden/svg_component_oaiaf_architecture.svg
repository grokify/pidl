<svg viewBox="0 0 820 550" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
    .component-box { stroke: #4a5568; stroke-width: 2; }
    .component-name { font-family: sans-serif; font-size: 13px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
    .component-type { font-family: sans-serif; font-size: 10px; fill: #718096; text-anchor: middle; }
    .component-roles { font-family: monospace; font-size: 9px; fill: #4a5568; text-anchor: middle; }
    .component-entities { font-family: sans-serif; font-size: 9px; fill: #718096; text-anchor: middle; }
    .component-examples { font-family: sans-serif; font-size: 8px; font-style: italic; fill: #a0aec0; text-anchor: middle; }
  </style>
  <text class="title" x="410" y="40">OAIAF Architecture - Components</text>
  <rect class="component-box" x="40" y="70" width="220" height="120" rx="8" fill="#cce5ff"/>
  <text class="component-name" x="150" y="90">Identity Provider</text>
  <text class="component-type" x="150" y="106">[idp]</text>
  <text class="component-roles" x="150" y="124">oauth:authorization_server, scim...</text>
  <text class="component-entities" x="150" y="170">Entities: idp</text>
  <text class="component-examples" x="150" y="184">e.g., Okta, Entra ID, Auth0</text>
  <rect class="component-box" x="300" y="70" width="220" height="120" rx="8" fill="#fff3cd"/>
  <text class="component-name" x="410" y="90">Agent Provider</text>
  <text class="component-type" x="410" y="106">[agent_provider]</text>
  <text class="component-roles" x="410" y="124">aauth:agent_provider</text>
  <text class="component-entities" x="410" y="170">Entities: agent_provider</text>
  <rect class="component-box" x="560" y="70" width="220" height="120" rx="8" fill="#c3e6cb"/>
  <text class="component-name" x="670" y="90">AI Assistant</text>
  <text class="component-type" x="670" y="106">[mcp_client]</text>
  <text class="component-roles" x="670" y="124">mcp:client, aauth:agent</text>
  <text class="component-entities" x="670" y="170">Entities: mcp_client</text>
  <text class="component-examples" x="670" y="184">e.g., Claude Desktop, ChatGPT, Cu...</text>
  <rect class="component-box" x="40" y="230" width="220" height="120" rx="8" fill="#bee5eb"/>
  <text class="component-name" x="150" y="250">Tool Server</text>
  <text class="component-type" x="150" y="266">[mcp_server]</text>
  <text class="component-roles" x="150" y="284">mcp:server</text>
  <text class="component-entities" x="150" y="330">Entities: mcp_server</text>
  <rect class="component-box" x="300" y="230" width="220" height="120" rx="8" fill="#e2d5f0"/>
  <text class="component-name" x="410" y="250">Policy Engine</text>
  <text class="component-type" x="410" y="266">[pdp]</text>
  <text class="component-roles" x="410" y="284">authzen:pdp</text>
  <text class="component-entities" x="410" y="330">Entities: pdp</text>
  <text class="component-examples" x="410" y="344">e.g., Topaz, OPA, Cedar</text>
  <rect class="component-box" x="560" y="230" width="220" height="120" rx="8" fill="#ffeeba"/>
  <text class="component-name" x="670" y="250">API Gateway</text>
  <text class="component-type" x="670" y="266">[gateway]</text>
  <text class="component-roles" x="670" y="284">authzen:pep, oauth:resource_server</text>
  <text class="component-entities" x="670" y="330">Entities: gateway</text>
  <text class="component-examples" x="670" y="344">e.g., Kong, Envoy, AWS API Gateway</text>
  <rect class="component-box" x="40" y="390" width="220" height="120" rx="8" fill="#f5c6cb"/>
  <text class="component-name" x="150" y="410">Resource APIs</text>
  <text class="component-type" x="150" y="426">[resource_api]</text>
  <text class="component-roles" x="150" y="444">oauth:resource_server</text>
  <text class="component-entities" x="150" y="490">Entities: resource_api</text>
</svg>
