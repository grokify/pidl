<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: sans-serif; font-size: 16px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .node-box { stroke: #4a5568; stroke-width: 2; }
    .node-name { font-family: sans-serif; font-size: 11px; font-weight: 500; fill: #e2e8f0; text-anchor: middle; }
    .edge-auth { stroke: #3182ce; stroke-width: 2; }
    .edge-issues { stroke: #38a169; stroke-width: 2; stroke-dasharray: 5,3; }
    .edge-delegates { stroke: #d69e2e; stroke-width: 2; }
    .edge-trusts { stroke: #805ad5; stroke-width: 2; stroke-dasharray: 3,3; }
    .edge-authorizes { stroke: #38a169; stroke-width: 2; }
    .edge-validates { stroke: #3182ce; stroke-width: 2; stroke-dasharray: 8,4; }
    .edge-provisions { stroke: #718096; stroke-width: 2; }
    .edge-attests { stroke: #e53e3e; stroke-width: 2; }
    .edge-default { stroke: #718096; stroke-width: 2; }
    .edge-label { font-family: sans-serif; font-size: 9px; fill: #4a5568; text-anchor: middle; }
    .edge-creds { font-family: monospace; font-size: 8px; fill: #718096; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow-trust" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-trust-mutual" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3182ce"/>
    </marker>
  </defs>
  <!-- Trust relationships -->
  <g class="edges">
    <line class="edge-auth" x1="331" y1="65" x2="393" y2="96" marker-end="url(#arrow-trust)"/>
    <text class="edge-label" x="361" y="92">authenticates</text>
    <line class="edge-issues" x1="440" y1="149" x2="455" y2="215" marker-end="url(#arrow-trust)"/>
    <text class="edge-label" x="437" y="188">issues</text>
    <line class="edge-issues" x1="395" y1="346" x2="438" y2="291" marker-end="url(#arrow-trust)"/>
    <text class="edge-label" x="428" y="322">issues</text>
    <line class="edge-validates" x1="205" y1="346" x2="162" y2="291" marker-end="url(#arrow-trust)"/>
    <text class="edge-label" x="190" y="308">validates</text>
    <line class="edge-authorizes" x1="157" y1="284" x2="200" y2="339" marker-end="url(#arrow-trust)"/>
    <text class="edge-label" x="172" y="322">authorizes</text>
    <line class="edge-trusts" x1="219" y1="339" x2="178" y2="157" marker-end="url(#arrow-trust-mutual)"/>
    <text class="edge-label" x="208" y="242">trusts</text>
    <line class="edge-delegates" x1="322" y1="77" x2="438" y2="223" marker-end="url(#arrow-trust)"/>
    <text class="edge-label" x="373" y="160">delegates</text>
  </g>
  <!-- Nodes -->
  <g class="nodes">
    <rect class="node-box" x="230" y="25" width="140" height="50" rx="6" fill="#fff3cd"/>
    <text class="node-name" x="300" y="54">user</text>
    <rect class="node-box" x="362" y="90" width="140" height="50" rx="6" fill="#cce5ff"/>
    <text class="node-name" x="432" y="119">idp_component</text>
    <rect class="node-box" x="395" y="232" width="140" height="50" rx="6" fill="#c3e6cb"/>
    <text class="node-name" x="465" y="261">mcp_client_comp...</text>
    <rect class="node-box" x="303" y="348" width="140" height="50" rx="6" fill="#fff3cd"/>
    <text class="node-name" x="373" y="377">agent_provider_...</text>
    <rect class="node-box" x="157" y="348" width="140" height="50" rx="6" fill="#ffeeba"/>
    <text class="node-name" x="227" y="377">gateway_component</text>
    <rect class="node-box" x="65" y="232" width="140" height="50" rx="6" fill="#e2d5f0"/>
    <text class="node-name" x="135" y="261">pdp_component</text>
    <rect class="node-box" x="98" y="90" width="140" height="50" rx="6" fill="#f5c6cb"/>
    <text class="node-name" x="168" y="119">resource_component</text>
  </g>
</svg>
