<svg viewBox="0 0 760 785" xmlns="http://www.w3.org/2000/svg" class="theme-light">
  <style>

    /* Light theme (default) */
    :root, .theme-light {
      --color-primary: #1a365d;
      --color-secondary: #2c5282;
      --color-accent: #3182ce;
      --color-bg: #ffffff;
      --color-text: #1a202c;
      --color-text-muted: #718096;
      --color-line: #3182ce;
      --color-line-response: #a0aec0;
      --color-lifeline: #cbd5e0;
      --color-participant-bg: #1a365d;
      --color-participant-text: #ffffff;
      --color-dot: #3182ce;
    }

    /* Dark theme */
    .theme-dark {
      --color-primary: #63b3ed;
      --color-secondary: #90cdf4;
      --color-accent: #4299e1;
      --color-bg: #1a202c;
      --color-text: #e2e8f0;
      --color-text-muted: #a0aec0;
      --color-line: #63b3ed;
      --color-line-response: #4a5568;
      --color-lifeline: #4a5568;
      --color-participant-bg: #4299e1;
      --color-participant-text: #ffffff;
      --color-dot: #63b3ed;
    }

    /* Element styles */
    .participant-box {
      fill: var(--color-participant-bg);
    }

    .participant-text {
      fill: var(--color-participant-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .lifeline {
      stroke: var(--color-lifeline);
      stroke-width: 1;
      stroke-dasharray: 4,4;
    }

    .message-line {
      fill: none;
      stroke: var(--color-line);
      stroke-width: 1.5;
    }

    .message-line-response {
      fill: none;
      stroke: var(--color-line-response);
      stroke-width: 1.5;
      stroke-dasharray: 6,3;
    }

    .message-arrow {
      fill: var(--color-line);
    }

    .message-arrow-response {
      fill: var(--color-line-response);
    }

    .message-text {
      fill: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
    }

    .step-circle {
      fill: var(--color-accent);
    }

    .step-number {
      fill: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Phase box styles */
    .phase-box {
      stroke: var(--color-lifeline);
      stroke-width: 1;
      stroke-dasharray: 4, 2;
    }

    .phase-label {
      fill: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Alternative badge styles */
    .alt-badge-bg {
      fill: var(--color-accent);
      opacity: 0.9;
    }

    .alt-badge-text {
      fill: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 8px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .alt-badge {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .alt-badge:hover {
      transform: scale(1.1);
    }

    /* Note styles */
    .message-note {
      fill: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-style: italic;
    }

    /* Interactive hover states */
    .participant-box {
      transition: filter 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .participant-box:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .message-line, .message-line-response {
      transition: stroke-width 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .message-line:hover, .message-line-response:hover {
      stroke-width: 2.5;
      filter: drop-shadow(0 0 2px var(--color-line));
    }

    .message-text {
      transition: font-weight 0.2s ease;
      cursor: pointer;
    }

    .message-text:hover {
      font-weight: 600;
    }

    .flow-dot {
      transition: r 0.15s ease;
    }

    .flow-dot:hover {
      r: 6;
    }

    .step-circle {
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .step-circle:hover {
      transform: scale(1.2);
    }

    /* Print styles */
    @media print {
      .flow-dot {
        display: none;
      }
      /* Disable hover effects in print */
      .participant-box:hover,
      .message-line:hover,
      .message-line-response:hover {
        filter: none;
        transform: none;
      }
    }

    /* Template color overrides */
    :root {
      --color-primary: #2563eb;
      --color-line: #3b82f6;
      --color-lifeline: #bfdbfe;
      --color-participant-bg: #dbeafe;
      --color-participant-text: #1e40af;
    }

    .participant-text, .message-text { font-family: 'Comic Sans MS', 'Chalkboard SE', cursive; }

    .message-line, .message-line-response { stroke-width: 2.0; }

    /* Template custom CSS */
/* Sketch template - hand-drawn style */
.participant-box {
  stroke: var(--color-line);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.lifeline {
  stroke-dasharray: 8,6;
  stroke-linecap: round;
}

.message-line, .message-line-response {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.step-circle {
  stroke: var(--color-line);
  stroke-width: 2;
}

/* Add subtle shadow for depth */
.participant-box {
  filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
}
  </style>

  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-message-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="message-arrow"/>
    </marker>
    <marker id="arrow-message-arrow-reverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" class="message-arrow"/>
    </marker>
    <marker id="arrow-message-arrow-response" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="message-arrow-response"/>
    </marker>
    <marker id="arrow-message-arrow-response-reverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" class="message-arrow-response"/>
    </marker>
  </defs>

  <text x="380" y="12" class="message-text" style="font-size:14px;font-weight:600;text-anchor:middle;">OAuth 2.0 Authorization Code Flow with PKCE</text>

  <!-- Phase boxes -->
  <g class="phase-boxes">
    <rect class="phase-box" x="50" y="40" width="360" height="110" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="58" y="54">PKCE Setup</text>
    <rect class="phase-box" x="50" y="150" width="510" height="330" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="58" y="164">Authorization</text>
    <rect class="phase-box" x="350" y="480" width="210" height="110" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="358" y="494">Token Exchange</text>
    <rect class="phase-box" x="350" y="590" width="360" height="110" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="358" y="604">Resource Access</text>
  </g>

  <!-- Lifelines -->
  <g class="lifelines">
    <line class="lifeline" x1="80" y1="65" x2="80" y2="760"/>
    <line class="lifeline" x1="230" y1="65" x2="230" y2="760"/>
    <line class="lifeline" x1="380" y1="65" x2="380" y2="760"/>
    <line class="lifeline" x1="530" y1="65" x2="530" y2="760"/>
    <line class="lifeline" x1="680" y1="65" x2="680" y2="760"/>
  </g>

  <!-- Participants -->
  <g class="participants">
    <rect class="participant-box" x="25" y="25" width="110" height="40" rx="8"/>
    <text class="participant-text" x="80" y="45">Resource Owner</text>
    <rect class="participant-box" x="175" y="25" width="110" height="40" rx="8"/>
    <text class="participant-text" x="230" y="45">User Agent</text>
    <rect class="participant-box" x="325" y="25" width="110" height="40" rx="8"/>
    <text class="participant-text" x="380" y="45">Public Client</text>
    <rect class="participant-box" x="475" y="25" width="110" height="40" rx="8"/>
    <text class="participant-text" x="530" y="45">Authorization Server</text>
    <rect class="participant-box" x="625" y="25" width="110" height="40" rx="8"/>
    <text class="participant-text" x="680" y="45">Resource Server</text>
  </g>

  <!-- Messages -->
  <g class="messages">
    <path id="msg-path-0" class="message-line" d="M80,70 L380,70" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="90" cy="70" r="8"/>
    <text class="step-number" x="90" y="70">1</text>
    <text class="message-text" x="230" y="62" text-anchor="middle">Click Login</text>
    <path id="msg-path-1" class="message-line" d="M380,125 L380,125" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="390" cy="125" r="8"/>
    <text class="step-number" x="390" y="125">2</text>
    <text class="message-text" x="380" y="117" text-anchor="middle">Generate code_verifier + code_challenge</text>
    <path id="msg-path-2" class="message-line" d="M380,180 L230,180" marker-end="url(#arrow-message-arrow-reverse)"/>
    <circle class="step-circle" cx="370" cy="180" r="8"/>
    <text class="step-number" x="370" y="180">3</text>
    <text class="message-text" x="305" y="172" text-anchor="middle">Redirect with code_challenge</text>
    <path id="msg-path-3" class="message-line" d="M230,235 L530,235" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="240" cy="235" r="8"/>
    <text class="step-number" x="240" y="235">4</text>
    <text class="message-text" x="380" y="227" text-anchor="middle">GET /authorize?code_challenge=...&amp;code_challenge_method=S256</text>
    <path id="msg-path-4" class="message-line" d="M530,290 L80,290" marker-end="url(#arrow-message-arrow-reverse)"/>
    <circle class="step-circle" cx="520" cy="290" r="8"/>
    <text class="step-number" x="520" y="290">5</text>
    <text class="message-text" x="305" y="282" text-anchor="middle">Login + Consent Form</text>
    <path id="msg-path-5" class="message-line" d="M80,345 L530,345" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="90" cy="345" r="8"/>
    <text class="step-number" x="90" y="345">6</text>
    <text class="message-text" x="305" y="337" text-anchor="middle">Submit Credentials + Grant Consent</text>
    <path id="msg-path-6" class="message-line" d="M530,400 L230,400" marker-end="url(#arrow-message-arrow-reverse)"/>
    <circle class="step-circle" cx="520" cy="400" r="8"/>
    <text class="step-number" x="520" y="400">7</text>
    <text class="message-text" x="380" y="392" text-anchor="middle">Redirect with code (code_challenge stored server-side)</text>
    <path id="msg-path-7" class="message-line" d="M230,455 L380,455" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="240" cy="455" r="8"/>
    <text class="step-number" x="240" y="455">8</text>
    <text class="message-text" x="305" y="447" text-anchor="middle">Callback with Authorization Code</text>
    <path id="msg-path-8" class="message-line" d="M380,510 L530,510" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="390" cy="510" r="8"/>
    <text class="step-number" x="390" y="510">9</text>
    <text class="message-text" x="455" y="502" text-anchor="middle">POST /token (code + code_verifier)</text>
    <path id="msg-path-9" class="message-line-response" d="M530,565 L380,565" marker-end="url(#arrow-message-arrow-response-reverse)"/>
    <circle class="step-circle" cx="520" cy="565" r="8"/>
    <text class="step-number" x="520" y="565">10</text>
    <text class="message-text" x="455" y="557" text-anchor="middle">Access Token + Refresh Token</text>
    <path id="msg-path-10" class="message-line" d="M380,620 L680,620" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="390" cy="620" r="8"/>
    <text class="step-number" x="390" y="620">11</text>
    <text class="message-text" x="530" y="612" text-anchor="middle">API Request (Authorization: Bearer &lt;token&gt;)</text>
    <path id="msg-path-11" class="message-line-response" d="M680,675 L380,675" marker-end="url(#arrow-message-arrow-response-reverse)"/>
    <circle class="step-circle" cx="670" cy="675" r="8"/>
    <text class="step-number" x="670" y="675">12</text>
    <text class="message-text" x="530" y="667" text-anchor="middle">Protected Resource</text>
  </g>
</svg>
