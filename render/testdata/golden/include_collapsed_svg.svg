<svg viewBox="0 0 560 390" xmlns="http://www.w3.org/2000/svg" class="theme-light">
  <style>

    /* Light theme (default) */
    :root, .theme-light {
      --color-primary: #1a365d;
      --color-secondary: #2c5282;
      --color-accent: #3182ce;
      --color-bg: #ffffff;
      --color-text: #1a202c;
      --color-text-muted: #718096;
      --color-line: #3182ce;
      --color-line-response: #a0aec0;
      --color-lifeline: #cbd5e0;
      --color-participant-bg: #1a365d;
      --color-participant-text: #ffffff;
      --color-dot: #3182ce;
    }

    /* Dark theme */
    .theme-dark {
      --color-primary: #63b3ed;
      --color-secondary: #90cdf4;
      --color-accent: #4299e1;
      --color-bg: #1a202c;
      --color-text: #e2e8f0;
      --color-text-muted: #a0aec0;
      --color-line: #63b3ed;
      --color-line-response: #4a5568;
      --color-lifeline: #4a5568;
      --color-participant-bg: #4299e1;
      --color-participant-text: #ffffff;
      --color-dot: #63b3ed;
    }

    /* Element styles */
    .participant-box {
      fill: var(--color-participant-bg);
    }

    .participant-text {
      fill: var(--color-participant-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .lifeline {
      stroke: var(--color-lifeline);
      stroke-width: 1;
      stroke-dasharray: 4,4;
    }

    .message-line {
      fill: none;
      stroke: var(--color-line);
      stroke-width: 1.5;
    }

    .message-line-response {
      fill: none;
      stroke: var(--color-line-response);
      stroke-width: 1.5;
      stroke-dasharray: 6,3;
    }

    .message-arrow {
      fill: var(--color-line);
    }

    .message-arrow-response {
      fill: var(--color-line-response);
    }

    .message-text {
      fill: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
    }

    .step-circle {
      fill: var(--color-accent);
    }

    .step-number {
      fill: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Phase box styles */
    .phase-box {
      stroke: var(--color-lifeline);
      stroke-width: 1;
      stroke-dasharray: 4, 2;
    }

    .phase-label {
      fill: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Alternative badge styles */
    .alt-badge-bg {
      fill: var(--color-accent);
      opacity: 0.9;
    }

    .alt-badge-text {
      fill: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 8px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .alt-badge {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .alt-badge:hover {
      transform: scale(1.1);
    }

    /* Note styles */
    .message-note {
      fill: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-style: italic;
    }

    /* Interactive hover states */
    .participant-box {
      transition: filter 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .participant-box:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .message-line, .message-line-response {
      transition: stroke-width 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .message-line:hover, .message-line-response:hover {
      stroke-width: 2.5;
      filter: drop-shadow(0 0 2px var(--color-line));
    }

    .message-text {
      transition: font-weight 0.2s ease;
      cursor: pointer;
    }

    .message-text:hover {
      font-weight: 600;
    }

    .flow-dot {
      transition: r 0.15s ease;
    }

    .flow-dot:hover {
      r: 6;
    }

    .step-circle {
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .step-circle:hover {
      transform: scale(1.2);
    }

    /* Print styles */
    @media print {
      .flow-dot {
        display: none;
      }
      /* Disable hover effects in print */
      .participant-box:hover,
      .message-line:hover,
      .message-line-response:hover {
        filter: none;
        transform: none;
      }
    }
  </style>

  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-message-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="message-arrow"/>
    </marker>
    <marker id="arrow-message-arrow-reverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" class="message-arrow"/>
    </marker>
    <marker id="arrow-message-arrow-response" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="message-arrow-response"/>
    </marker>
    <marker id="arrow-message-arrow-response-reverse" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" class="message-arrow-response"/>
    </marker>
  </defs>

  <text x="280" y="12" class="message-text" style="font-size:14px;font-weight:600;text-anchor:middle;">Scenarios Demo — PS authorization</text>

  <!-- Phase boxes -->
  <g class="phase-boxes">
    <rect class="phase-box" x="40" y="130" width="480" height="145" rx="4" style="fill: rgba(49, 130, 206, 0.08);"/>
    <text class="phase-label" x="48" y="144">Authorize</text>
  </g>

  <!-- Lifelines -->
  <g class="lifelines">
    <line class="lifeline" x1="70" y1="56" x2="70" y2="370"/>
    <line class="lifeline" x1="210" y1="56" x2="210" y2="370"/>
    <line class="lifeline" x1="350" y1="56" x2="350" y2="370"/>
    <line class="lifeline" x1="490" y1="56" x2="490" y2="370"/>
  </g>

  <!-- Participants -->
  <g class="participants">
    <rect class="participant-box" x="20" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="70" y="38">Person</text>
    <rect class="participant-box" x="160" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="210" y="38">Agent</text>
    <rect class="participant-box" x="300" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="350" y="38">Resource</text>
    <rect class="participant-box" x="440" y="20" width="100" height="36" rx="4"/>
    <text class="participant-text" x="490" y="38">Person Server</text>
  </g>

  <!-- Messages -->
  <g class="messages">
    <path id="msg-path-0" class="message-line" d="M210,70 L350,70" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="220" cy="70" r="8"/>
    <text class="step-number" x="220" y="70">1</text>
    <text class="message-text" x="280" y="62" text-anchor="middle">Request</text>
    <path id="msg-path-1" class="message-line-response" d="M350,115 L210,115" marker-end="url(#arrow-message-arrow-response-reverse)"/>
    <circle class="step-circle" cx="340" cy="115" r="8"/>
    <text class="step-number" x="340" y="115">2</text>
    <text class="message-text" x="280" y="107" text-anchor="middle">401 + resource token</text>
    <path id="msg-path-2" class="message-line" d="M210,160 L490,160" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="220" cy="160" r="8"/>
    <text class="step-number" x="220" y="160">3</text>
    <text class="message-text" x="350" y="152" text-anchor="middle">Auth token request</text>
    <rect class="include-box" x="50" y="193" width="460" height="24" rx="6" style="fill: rgba(127, 127, 127, 0.12); stroke: rgba(127, 127, 127, 0.6);"/>
    <text class="message-text" x="280" y="209" text-anchor="middle">ref: Consent</text>
    <path id="msg-path-4" class="message-line-response" d="M490,250 L210,250" marker-end="url(#arrow-message-arrow-response-reverse)"/>
    <circle class="step-circle" cx="480" cy="250" r="8"/>
    <text class="step-number" x="480" y="250">5</text>
    <text class="message-text" x="350" y="242" text-anchor="middle">Auth token</text>
    <path id="msg-path-5" class="message-line" d="M210,295 L350,295" marker-end="url(#arrow-message-arrow)"/>
    <circle class="step-circle" cx="220" cy="295" r="8"/>
    <text class="step-number" x="220" y="295">6</text>
    <text class="message-text" x="280" y="287" text-anchor="middle">Request + auth token</text>
  </g>
</svg>
