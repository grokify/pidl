[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-pidl"
version = "0.1.0"
description = "MkDocs plugin for PIDL diagram rendering"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "John Wang", email = "johncwang@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mkdocs>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[project.entry-points."mkdocs.plugins"]
pidl = "mkdocs_pidl.plugin:PidlPlugin"

[project.urls]
Homepage = "https://github.com/grokify/pidl"
Documentation = "https://grokify.github.io/pidl/"
Repository = "https://github.com/grokify/pidl"
Issues = "https://github.com/grokify/pidl/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
