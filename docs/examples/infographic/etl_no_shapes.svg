<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    .node { filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #495057; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #212529; }
    .icon { font-size: 20px; }
    .edge { fill: none; stroke: #adb5bd; stroke-width: 2; stroke-linecap: round; }
